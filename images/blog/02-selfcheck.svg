<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" role="img" aria-label="四个问题自测，按打勾数量分三档：0 到 1 个勾别折腾，2 到 3 个勾两边都写，4 个勾直接自建">
  <style>
    .bg { fill: #f7f1e3; }
    .t { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1c1a17; }
    .th { font-size: 19px; font-weight: 700; }
    .ts { font-size: 13px; fill: #4c463e; }
    .qn { font-size: 13px; }
    .lb { font-size: 10.5px; font-weight: 700; }
    .ct { font-size: 15.5px; font-weight: 700; }
    .cd { font-size: 11px; fill: #4c463e; }
    .ft { font-size: 11.5px; fill: #6b6459; }
    .wt { font-size: 12px; font-weight: 700; fill: #fffdf6; }
    .c1 { fill: #2f5d8a; }
    .c2 { fill: #4f7f47; }
    .c3 { fill: #c9962a; }
    .c4 { fill: #cc3b3b; }
    .t1 { fill: #2f5d8a; }
    .t3 { fill: #a8791f; }
    .t5 { fill: #8a8175; }
    .box { fill: #fffdf6; stroke: #b9ae98; stroke-width: 1.5; }
    .ln { stroke: #ded3bb; stroke-width: 1; }
    .ca { fill: #fffdf6; stroke: #8a8175; stroke-width: 2; }
    .cb { fill: #fffdf6; stroke: #c9962a; stroke-width: 2; }
    .cc { fill: #fffdf6; stroke: #2f5d8a; stroke-width: 2; }
  </style>

  <rect class="bg" width="680" height="500"/>

  <text class="t th" x="34" y="38">四个问题，决定你该不该自己搭站</text>
  <text class="t ts" x="34" y="60">符合就打勾——数量比感觉准</text>

  <!-- 四个问题 -->
  <circle class="c1" cx="52" cy="110" r="14"/>
  <text class="t wt" x="52" y="115" text-anchor="middle">1</text>
  <text class="t qn" x="78" y="115">三年后，你希望这篇文章还能原样打开吗？</text>
  <rect class="box" x="612" y="102" width="16" height="16" rx="3"/>
  <line class="ln" x1="30" y1="136" x2="650" y2="136"/>

  <circle class="c1" cx="52" cy="162" r="14"/>
  <text class="t wt" x="52" y="167" text-anchor="middle">2</text>
  <text class="t qn" x="78" y="167">你愿意为排版和结构多花一点时间吗？</text>
  <rect class="box" x="612" y="154" width="16" height="16" rx="3"/>
  <line class="ln" x1="30" y1="188" x2="650" y2="188"/>

  <circle class="c1" cx="52" cy="214" r="14"/>
  <text class="t wt" x="52" y="219" text-anchor="middle">3</text>
  <text class="t qn" x="78" y="219">你能接受前半年几乎没人看吗？</text>
  <rect class="box" x="612" y="206" width="16" height="16" rx="3"/>
  <line class="ln" x1="30" y1="240" x2="650" y2="240"/>

  <circle class="c1" cx="52" cy="266" r="14"/>
  <text class="t wt" x="52" y="271" text-anchor="middle">4</text>
  <text class="t qn" x="78" y="271">你愿意每年花 2 小时给它做一次体检吗？</text>
  <rect class="box" x="612" y="258" width="16" height="16" rx="3"/>

  <text class="t cd" x="34" y="312">打勾越多，越说明你要的是控制权，而不是流量。</text>

  <!-- 三档结论 -->
  <rect class="ca" x="30" y="332" width="196" height="130" rx="10"/>
  <text class="t lb t5" x="48" y="358">0~1 个勾</text>
  <text class="t ct t5" x="48" y="390">别折腾</text>
  <text class="t cd" x="48" y="418">平台完全够用</text>
  <text class="t cd" x="48" y="438">把时间留给写</text>

  <rect class="cb" x="242" y="332" width="196" height="130" rx="10"/>
  <text class="t lb t3" x="260" y="358">2~3 个勾</text>
  <text class="t ct t3" x="260" y="390">两边都写</text>
  <text class="t cd" x="260" y="418">平台为主，自建存档</text>
  <text class="t cd" x="260" y="438">每季度导出一次</text>

  <rect class="cc" x="454" y="332" width="196" height="130" rx="10"/>
  <text class="t lb t1" x="472" y="358">4 个勾</text>
  <text class="t ct t1" x="472" y="390">直接自建</text>
  <text class="t cd" x="472" y="418">你要的是控制权</text>
  <text class="t cd" x="472" y="438">不是流量</text>

  <text class="t ft" x="34" y="488">这一栏只服务第 4 种人。前两种读完这篇就可以合上了。</text>
</svg>
