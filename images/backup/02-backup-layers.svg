<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" role="img" aria-label="四层备份方案：本机另一块盘、移动硬盘、网盘、离线冷备，各自的成本与能防住什么">
  <style>
    .bg { fill: #f7f1e3; }
    .t { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1c1a17; }
    .th { font-size: 19px; font-weight: 700; }
    .ts { font-size: 12.5px; fill: #4c463e; }
    .nm { font-size: 13.5px; font-weight: 700; }
    .cost { font-size: 10.5px; fill: #8a8175; }
    .lb { font-size: 9.5px; font-weight: 700; fill: #8a8175; }
    .v { font-size: 11px; fill: #4c463e; }
    .ft { font-size: 11.5px; fill: #6b6459; }
    .wt { font-size: 11.5px; font-weight: 700; fill: #fffdf6; }
    .card { fill: #fffdf6; stroke: #e0d6c0; stroke-width: 1.5; }
    .c0 { fill: #8a8175; }
    .c1 { fill: #4f7f47; }
    .c2 { fill: #2f5d8a; }
    .c3 { fill: #c9962a; }
    .t1 { fill: #3d6338; }
    .t2 { fill: #2f5d8a; }
    .t3 { fill: #a8791f; }
  </style>

  <rect class="bg" width="680" height="450"/>

  <text class="t th" x="34" y="38">四层方案：按"代价"从低到高排</text>
  <text class="t ts" x="34" y="60">不用四层全上，但至少要有一层不在本机、一层不在本屋</text>

  <!-- 第 0 层 -->
  <rect class="card" x="30" y="84" width="620" height="74" rx="10"/>
  <circle class="c0" cx="58" cy="112" r="15"/>
  <text class="t wt" x="58" y="117" text-anchor="middle">0</text>
  <text class="t nm" x="84" y="113">本机另一块盘</text>
  <text class="t cost" x="84" y="134">成本：0 元（盘本来就有）</text>
  <text class="t lb" x="340" y="105">挡得住</text>
  <text class="t v" x="340" y="123">手滑删错、改错了想反悔</text>
  <text class="t lb" x="340" y="143">挡不住</text>
  <text class="t v" x="404" y="143">整机丢失、进水、雷击</text>

  <!-- 第 1 层 -->
  <rect class="card" x="30" y="166" width="620" height="74" rx="10"/>
  <circle class="c1" cx="58" cy="194" r="15"/>
  <text class="t wt" x="58" y="199" text-anchor="middle">1</text>
  <text class="t nm t1" x="84" y="195">移动硬盘</text>
  <text class="t cost" x="84" y="216">成本：1TB 约 300~500 元，一次投入</text>
  <text class="t lb" x="340" y="187">挡得住</text>
  <text class="t v" x="340" y="205">原盘坏、系统崩、误删</text>
  <text class="t lb" x="340" y="225">挡不住</text>
  <text class="t v" x="404" y="225">和电脑一起丢（放同一个包里）</text>

  <!-- 第 2 层 -->
  <rect class="card" x="30" y="248" width="620" height="74" rx="10"/>
  <circle class="c2" cx="58" cy="276" r="15"/>
  <text class="t wt" x="58" y="281" text-anchor="middle">2</text>
  <text class="t nm t2" x="84" y="277">网盘 / 云存储</text>
  <text class="t cost" x="84" y="298">成本：免费 5~15GB；付费约 100~300 元 / 年</text>
  <text class="t lb" x="340" y="269">挡得住</text>
  <text class="t v" x="340" y="287">本地灾难、忘备份（自动同步）</text>
  <text class="t lb" x="340" y="307">挡不住</text>
  <text class="t v" x="404" y="307">误删（删除会同步上去）</text>

  <!-- 第 3 层 -->
  <rect class="card" x="30" y="330" width="620" height="74" rx="10"/>
  <circle class="c3" cx="58" cy="358" r="15"/>
  <text class="t wt" x="58" y="363" text-anchor="middle">3</text>
  <text class="t nm t3" x="84" y="359">离线冷备</text>
  <text class="t cost" x="84" y="380">成本：一块盘 + 每季度通电一次</text>
  <text class="t lb" x="340" y="351">挡得住</text>
  <text class="t v" x="340" y="369">勒索病毒、潜伏很久的损坏</text>
  <text class="t lb" x="340" y="389">挡不住</text>
  <text class="t v" x="404" y="389">你自己忘记更新它</text>

  <text class="t ft" x="34" y="430">最低配：第 0 层（顺手）+ 第 1 层（一块硬盘）+ 第 2 层（一个网盘）。三层就是完整的 3-2-1。</text>
</svg>
