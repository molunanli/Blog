<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-label="进入主板设置界面的三条路径：开机按键、Windows 高级启动、命令行，各自的适用场景与坑">
  <style>
    .bg { fill: #f7f1e3; }
    .t { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1c1a17; }
    .th { font-size: 19px; font-weight: 700; }
    .ts { font-size: 12.5px; fill: #4c463e; }
    .nm { font-size: 14px; font-weight: 700; }
    .op { font-size: 11.5px; fill: #1c1a17; }
    .pt { font-size: 11px; fill: #8a8175; }
    .ft { font-size: 11.5px; fill: #6b6459; }
    .wt { font-size: 11.5px; font-weight: 700; fill: #fffdf6; }
    .card { fill: #fffdf6; stroke: #e0d6c0; stroke-width: 1.5; }
    .c1 { fill: #c9962a; }
    .c2 { fill: #2f5d8a; }
    .c3 { fill: #4f7f47; }
  </style>

  <rect class="bg" width="680" height="440"/>

  <text class="t th" x="34" y="38">进主板的三种办法：按不上就换下一条</text>
  <text class="t ts" x="34" y="60">第一条最快但吃时机，第二条最稳但绕路</text>

  <!-- ① 开机按键 -->
  <rect class="card" x="30" y="84" width="620" height="96" rx="10"/>
  <circle class="c1" cx="58" cy="116" r="15"/>
  <text class="t wt" x="58" y="121" text-anchor="middle">1</text>
  <text class="t nm" x="84" y="121">开机连按 Del / F2</text>
  <text class="t op" x="84" y="145">通电后立刻开始连按，一秒两下，别等 Logo 出来</text>
  <text class="t pt" x="84" y="166">坑：Win11 的快速启动会跳过这个窗口，按到手抽筋也进不去</text>

  <!-- ② 高级启动 -->
  <rect class="card" x="30" y="190" width="620" height="96" rx="10"/>
  <circle class="c2" cx="58" cy="222" r="15"/>
  <text class="t wt" x="58" y="227" text-anchor="middle">2</text>
  <text class="t nm" x="84" y="227">设置 → 系统 → 恢复 → 高级启动</text>
  <text class="t op" x="84" y="251">重启后依次选：疑难解答 → 高级选项 → UEFI 固件设置</text>
  <text class="t pt" x="84" y="272">坑：要多走三层菜单，但只要系统能进，这条一定进得去</text>

  <!-- ③ 命令行 -->
  <rect class="card" x="30" y="296" width="620" height="96" rx="10"/>
  <circle class="c3" cx="58" cy="328" r="15"/>
  <text class="t wt" x="58" y="333" text-anchor="middle">3</text>
  <text class="t nm" x="84" y="333">命令行 shutdown /r /fw /t 0</text>
  <text class="t op" x="84" y="357">管理员权限运行，机器直接重启并跳进固件设置</text>
  <text class="t pt" x="84" y="378">坑：只对 UEFI 启动的机器有效，老 BIOS 机器会当普通重启</text>

  <text class="t ft" x="34" y="420">三条都不行，先换有线键盘、插机箱后面的 USB 2.0 口再试——无线键盘在自检阶段常常没被识别。</text>
</svg>
