<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" role="img" aria-label="驱动问题的三问定位决策树：有黄色感叹号吗、是不是突然坏的、影响性能吗，三个问题都不落入处理分支就什么都别动">
  <style>
    .bg { fill: #f7f1e3; }
    .t { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1c1a17; }
    .th { font-size: 19px; font-weight: 700; }
    .ts { font-size: 13px; fill: #4c463e; }
    .q { font-size: 14px; font-weight: 700; }
    .qs { font-size: 11.5px; fill: #4c463e; }
    .at { font-size: 13px; font-weight: 700; }
    .al { font-size: 11.5px; fill: #4c463e; }
    .lb { font-size: 11px; font-weight: 700; }
    .fb { font-size: 13.5px; font-weight: 700; fill: #fffdf6; }
    .fl { font-size: 11.5px; fill: #d8cfba; }
    .card { fill: #fffdf6; }
    .qb { stroke: #2f5d8a; stroke-width: 2.5; }
    .a1 { stroke: #4f7f47; stroke-width: 2.5; }
    .a2 { stroke: #c9962a; stroke-width: 2.5; }
    .a3 { stroke: #cc3b3b; stroke-width: 2.5; }
    .dark { fill: #1c1a17; }
    .ln { stroke: #6b6459; stroke-width: 2; fill: none; }
  </style>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6459"/>
    </marker>
  </defs>

  <rect class="bg" width="680" height="500"/>

  <text class="t th" x="34" y="38">三问定位：到底该不该动驱动</text>
  <text class="t ts" x="34" y="60">左边是问题，右边是动作。三问走完没落到动作上，就什么都别做</text>

  <!-- Q1 -->
  <rect class="card qb" x="30" y="84" width="300" height="76" rx="8"/>
  <text class="t q" x="46" y="114" style="fill:#2f5d8a">① 设备管理器里有感叹号吗？</text>
  <text class="t qs" x="46" y="140">Win + R → devmgmt.msc</text>
  <line class="ln" x1="330" y1="122" x2="384" y2="122" marker-end="url(#arw)"/>
  <text class="t lb" x="340" y="114" style="fill:#4f7f47">有</text>
  <rect class="card a1" x="390" y="84" width="260" height="76" rx="8"/>
  <text class="t at" x="406" y="111" style="fill:#4f7f47">缺驱动</text>
  <text class="t al" x="406" y="133">认型号 → 找来源 → 装上</text>
  <text class="t al" x="406" y="151">（第四、五节）</text>

  <line class="ln" x1="180" y1="160" x2="180" y2="188" marker-end="url(#arw)"/>
  <text class="t lb" x="188" y="180" style="fill:#8a8175">没有</text>

  <!-- Q2 -->
  <rect class="card qb" x="30" y="192" width="300" height="76" rx="8"/>
  <text class="t q" x="46" y="222" style="fill:#2f5d8a">② 是不是"突然坏的"？</text>
  <text class="t qs" x="46" y="248">之前一直正常，某次更新后才出问题</text>
  <line class="ln" x1="330" y1="230" x2="384" y2="230" marker-end="url(#arw)"/>
  <text class="t lb" x="340" y="222" style="fill:#c9962a">是</text>
  <rect class="card a2" x="390" y="192" width="260" height="76" rx="8"/>
  <text class="t at" x="406" y="219" style="fill:#a8791f">先回退，别急着重装</text>
  <text class="t al" x="406" y="241">设备管理器 → 属性</text>
  <text class="t al" x="406" y="259">→ 驱动程序 → 回退驱动程序</text>

  <line class="ln" x1="180" y1="268" x2="180" y2="296" marker-end="url(#arw)"/>
  <text class="t lb" x="188" y="288" style="fill:#8a8175">不是</text>

  <!-- Q3 -->
  <rect class="card qb" x="30" y="300" width="300" height="76" rx="8"/>
  <text class="t q" x="46" y="330" style="fill:#2f5d8a">③ 影响性能吗？</text>
  <text class="t qs" x="46" y="356">游戏 / 渲染 / 剪辑 明显不如同配置</text>
  <line class="ln" x1="330" y1="338" x2="384" y2="338" marker-end="url(#arw)"/>
  <text class="t lb" x="340" y="330" style="fill:#cc3b3b">影响</text>
  <rect class="card a3" x="390" y="300" width="260" height="76" rx="8"/>
  <text class="t at" x="406" y="327" style="fill:#cc3b3b">只动显卡驱动</text>
  <text class="t al" x="406" y="349">用 DDU 卸干净再装</text>
  <text class="t al" x="406" y="367">（第九节）</text>

  <line class="ln" x1="180" y1="376" x2="180" y2="404" marker-end="url(#arw)"/>
  <text class="t lb" x="188" y="396" style="fill:#8a8175">不影响</text>

  <!-- 结论 -->
  <rect class="dark" x="30" y="408" width="620" height="66" rx="8"/>
  <text class="t fb" x="340" y="436" text-anchor="middle">三问都没落到动作上 → 什么都不用做</text>
  <text class="t fl" x="340" y="458" text-anchor="middle">设备工作正常时，"不更新"就是正确答案</text>
</svg>
