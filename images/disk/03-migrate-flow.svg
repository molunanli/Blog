<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" role="img" aria-label="硬盘数据抢救的正确顺序与常见错误对照：先停止写入、镜像克隆、验证数据，而不是先修复或格式化">
  <style>
    .bg { fill: #f7f1e3; }
    .t { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1c1a17; }
    .th { font-size: 19px; font-weight: 700; }
    .ts { font-size: 13px; fill: #4c463e; }
    .tn { font-size: 14px; font-weight: 600; }
    .tl { font-size: 12.5px; fill: #4c463e; }
    .good { fill: #e8f0e4; stroke: #4f7f47; stroke-width: 2.5; }
    .bad { fill: #f5e2e2; stroke: #cc3b3b; stroke-width: 2.5; }
    .step { fill: #fffdf6; stroke: #4f7f47; stroke-width: 2; }
    .stepb { fill: #fffdf6; stroke: #cc3b3b; stroke-width: 2; }
    .gnum { fill: #4f7f47; }
    .rnum { fill: #cc3b3b; }
    .numt { font-size: 12px; font-weight: 700; fill: #fffdf6; }
    .hdr { font-size: 14px; font-weight: 700; }
  </style>

  <rect class="bg" width="680" height="430"/>

  <text class="t th" x="34" y="38">硬盘救数据：顺序错了，可能一次都救不回来</text>
  <text class="t ts" x="34" y="60">发现硬盘报警后的第一件事是"少动它"，而不是"修它"——每一次读写都在赌剩余寿命</text>

  <!-- 左：正确 -->
  <rect class="good" x="30" y="82" width="304" height="316" rx="8"/>
  <text class="t hdr" x="48" y="110" style="fill:#4f7f47">✅ 正确顺序（数据优先）</text>

  <rect class="step" x="48" y="126" width="268" height="46" rx="5"/>
  <circle class="gnum" cx="68" cy="149" r="12"/>
  <text class="t numt" x="68" y="153" text-anchor="middle">1</text>
  <text class="t tn" x="90" y="145">立刻停止一切写入</text>
  <text class="t tl" x="90" y="163">别再下载、别装软件、别跑杀毒</text>

  <rect class="step" x="48" y="180" width="268" height="46" rx="5"/>
  <circle class="gnum" cx="68" cy="203" r="12"/>
  <text class="t numt" x="68" y="207" text-anchor="middle">2</text>
  <text class="t tn" x="90" y="199">准备新盘或移动硬盘</text>
  <text class="t tl" x="90" y="217">容量 ≥ 旧盘已用空间，别现场买</text>

  <rect class="step" x="48" y="234" width="268" height="46" rx="5"/>
  <circle class="gnum" cx="68" cy="257" r="12"/>
  <text class="t numt" x="68" y="261" text-anchor="middle">3</text>
  <text class="t tn" x="90" y="253">整盘镜像 / 克隆，一次拷完</text>
  <text class="t tl" x="90" y="271">用 DiskGenius 等做镜像，少通电路径</text>

  <rect class="step" x="48" y="288" width="268" height="46" rx="5"/>
  <circle class="gnum" cx="68" cy="311" r="12"/>
  <text class="t numt" x="68" y="315" text-anchor="middle">4</text>
  <text class="t tn" x="90" y="307">先验证，再格式化旧盘</text>
  <text class="t tl" x="90" y="325">能打开、张数/大小对得上才算数</text>

  <rect class="step" x="48" y="342" width="268" height="42" rx="5"/>
  <circle class="gnum" cx="68" cy="363" r="12"/>
  <text class="t numt" x="68" y="367" text-anchor="middle">5</text>
  <text class="t tn" x="90" y="359">旧盘降级为只读备份 / 送回收</text>
  <text class="t tl" x="90" y="377">别再当主力盘用</text>

  <!-- 右：错误 -->
  <rect class="bad" x="346" y="82" width="304" height="316" rx="8"/>
  <text class="t hdr" x="364" y="110" style="fill:#cc3b3b">❌ 常见错误（往往致命）</text>

  <rect class="stepb" x="364" y="126" width="268" height="46" rx="5"/>
  <circle class="rnum" cx="384" cy="149" r="12"/>
  <text class="t numt" x="384" y="153" text-anchor="middle">✕</text>
  <text class="t tn" x="406" y="145">先跑 chkdsk /f 修复</text>
  <text class="t tl" x="406" y="163">全盘读写，常把濒死盘彻底拖死</text>

  <rect class="stepb" x="364" y="180" width="268" height="46" rx="5"/>
  <circle class="rnum" cx="384" cy="203" r="12"/>
  <text class="t numt" x="384" y="207" text-anchor="middle">✕</text>
  <text class="t tn" x="406" y="199">反复扫描"坏道修复"工具</text>
  <text class="t tl" x="406" y="217">扫一遍就是一次折磨，越修越糟</text>

  <rect class="stepb" x="364" y="234" width="268" height="46" rx="5"/>
  <circle class="rnum" cx="384" cy="257" r="12"/>
  <text class="t numt" x="384" y="261" text-anchor="middle">✕</text>
  <text class="t tn" x="406" y="253">先格式化、重装系统</text>
  <text class="t tl" x="406" y="271">数据直接没了，悔之晚矣</text>

  <rect class="stepb" x="364" y="288" width="268" height="46" rx="5"/>
  <circle class="rnum" cx="384" cy="311" r="12"/>
  <text class="t numt" x="384" y="315" text-anchor="middle">✕</text>
  <text class="t tn" x="406" y="307">不停重开机试运气</text>
  <text class="t tl" x="406" y="325">每一次上电都在赌磁头不再刮盘</text>

  <rect class="stepb" x="364" y="342" width="268" height="42" rx="5"/>
  <circle class="rnum" cx="384" cy="363" r="12"/>
  <text class="t numt" x="384" y="367" text-anchor="middle">✕</text>
  <text class="t tn" x="406" y="359">把病盘拆开"看看"</text>
  <text class="t tl" x="406" y="377">灰尘一进，专业恢复也救不回</text>

  <text class="t tl" x="34" y="420" style="fill:#6b6459">一句话：硬盘报警时，"少动"就是最好的维修。拷贝到新盘之后，旧盘随便折腾都行。</text>
</svg>
