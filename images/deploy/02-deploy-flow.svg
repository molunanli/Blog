<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" role="img" aria-label="部署脚本的六个步骤，以及每一步不做的后果">
  <style>
    .bg { fill: #f7f1e3; }
    .t { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1c1a17; }
    .m { font-family: ui-monospace, Consolas, "Courier New", monospace; }
    .th { font-size: 19px; font-weight: 700; }
    .ts { font-size: 12.5px; fill: #4c463e; }
    .nm { font-size: 11.5px; font-weight: 700; }
    .ds { font-size: 10px; fill: #4c463e; }
    .wt { font-size: 11px; font-weight: 700; fill: #fffdf6; }
    .ft { font-size: 11.5px; fill: #6b6459; }
    .card { fill: #fffdf6; stroke: #e0d6c0; stroke-width: 1.5; }
    .key { fill: #fffdf6; stroke: #cc3b3b; stroke-width: 2; }
    .c { fill: #2f5d8a; }
    .cr { fill: #cc3b3b; }
    .tn { fill: #2f5d8a; }
    .tr { fill: #b02f2f; }
  </style>

  <rect class="bg" width="680" height="460"/>

  <text class="t th" x="30" y="38">脚本的六步，每一步都在挡一种事故</text>
  <text class="t ts" x="30" y="60">顺序不能调：前四步保证"推对了东西"，后两步保证"真的推上去了"</text>

  <rect class="card" x="30" y="80" width="616" height="50" rx="8"/>
  <circle class="c" cx="54" cy="105" r="12"/>
  <text class="t wt" x="54" y="109" text-anchor="middle">1</text>
  <text class="t m nm tn" x="76" y="102">检查 4000 端口</text>
  <text class="t ds" x="76" y="119">不做：hexo server 会把 db.json 写回去，列表页用的是旧数据</text>

  <rect class="card" x="30" y="136" width="616" height="50" rx="8"/>
  <circle class="c" cx="54" cy="161" r="12"/>
  <text class="t wt" x="54" y="165" text-anchor="middle">2</text>
  <text class="t m nm tn" x="76" y="158">删除 db.json</text>
  <text class="t ds" x="76" y="175">不做：generate 读到旧缓存，新文章不进首页和归档（但详情页是新的）</text>

  <rect class="card" x="30" y="192" width="616" height="50" rx="8"/>
  <circle class="c" cx="54" cy="217" r="12"/>
  <text class="t wt" x="54" y="221" text-anchor="middle">3</text>
  <text class="t m nm tn" x="76" y="214">hexo generate</text>
  <text class="t ds" x="76" y="231">不做：push 上去的是上一次的产物，改了文章但线上没变</text>

  <rect class="key" x="30" y="248" width="616" height="50" rx="8"/>
  <circle class="cr" cx="54" cy="273" r="12"/>
  <text class="t wt" x="54" y="277" text-anchor="middle">4</text>
  <text class="t m nm tr" x="76" y="270">核验产物：首页必须含最新文章的 slug</text>
  <text class="t ds" x="76" y="287">不做：构建"成功"了，但你不知道推上去的是不是你要的东西</text>

  <rect class="key" x="30" y="304" width="616" height="50" rx="8"/>
  <circle class="cr" cx="54" cy="329" r="12"/>
  <text class="t wt" x="54" y="333" text-anchor="middle">5</text>
  <text class="t m nm tr" x="76" y="326">清树 → 复制 → add → commit → push（五条命令，分开跑）</text>
  <text class="t ds" x="76" y="343">不做：commit 与 push 用 &amp;&amp; 串起来时，commit 返回非零会静默跳过 push</text>

  <rect class="card" x="30" y="360" width="616" height="50" rx="8"/>
  <circle class="c" cx="54" cy="385" r="12"/>
  <text class="t wt" x="54" y="389" text-anchor="middle">6</text>
  <text class="t m nm tn" x="76" y="382">轮询线上首页，直到 200 且含新内容</text>
  <text class="t ds" x="76" y="399">不做：推送成功 ≠ 上线成功，GitHub Pages 还要构建几十秒</text>

  <text class="t ft" x="30" y="436">红框两步是关于"别骗自己"的：构建成功、推送成功，都不等于线上真的变了。</text>
</svg>
