<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" role="img" aria-label="三种站内链接写法在换域名、换根路径之后的存活情况对比">
  <style>
    .bg { fill: #f7f1e3; }
    .t { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1c1a17; }
    .m { font-family: ui-monospace, Consolas, "Courier New", monospace; }
    .th { font-size: 19px; font-weight: 700; }
    .ts { font-size: 12.5px; fill: #4c463e; }
    .hd { font-size: 10.5px; font-weight: 700; fill: #4c463e; }
    .code { font-size: 9.5px; fill: #1c1a17; }
    .nm { font-size: 11px; font-weight: 700; }
    .ft { font-size: 11.5px; fill: #6b6459; }
    .card { fill: #fffdf6; stroke: #e0d6c0; stroke-width: 1.5; }
    .ok { font-size: 15px; font-weight: 700; fill: #4f7f47; }
    .no { font-size: 15px; font-weight: 700; fill: #cc3b3b; }
    .ln { stroke: #e5dcc9; stroke-width: 1; }
    .best { fill: #fffdf6; stroke: #4f7f47; stroke-width: 2; }
  </style>

  <rect class="bg" width="680" height="380"/>

  <text class="t th" x="30" y="36">站内链接的三种写法，哪种换域名后还活着</text>
  <text class="t ts" x="30" y="58">同样是链到一篇文章，写法不同，迁移成本差一个数量级</text>

  <!-- 表头 -->
  <text class="t hd" x="44" y="96">写法</text>
  <text class="t hd" x="352" y="96" text-anchor="middle">现在</text>
  <text class="t hd" x="462" y="96" text-anchor="middle">只换域名</text>
  <text class="t hd" x="572" y="96" text-anchor="middle">换到根目录</text>
  <line class="ln" x1="30" y1="108" x2="646" y2="108"/>

  <!-- 行 1：绝对地址 -->
  <rect class="card" x="30" y="120" width="616" height="62" rx="8"/>
  <text class="t nm" x="44" y="142">① 写死的绝对地址</text>
  <text class="t m code" x="44" y="162">https://molunanli.github.io/Blog/2026/...</text>
  <text class="t ok" x="352" y="157" text-anchor="middle">✓</text>
  <text class="t no" x="462" y="157" text-anchor="middle">✗</text>
  <text class="t no" x="572" y="157" text-anchor="middle">✗</text>

  <!-- 行 2：站内绝对路径 -->
  <rect class="card" x="30" y="190" width="616" height="62" rx="8"/>
  <text class="t nm" x="44" y="212">② 以 root 开头的路径</text>
  <text class="t m code" x="44" y="232">/Blog/2026/09/pc-repair-first-lesson/</text>
  <text class="t ok" x="352" y="227" text-anchor="middle">✓</text>
  <text class="t ok" x="462" y="227" text-anchor="middle">✓</text>
  <text class="t no" x="572" y="227" text-anchor="middle">✗</text>

  <!-- 行 3：post_link -->
  <rect class="best" x="30" y="260" width="616" height="62" rx="8"/>
  <text class="t nm" x="44" y="282">③ post_link 标签（构建时解析）</text>
  <text class="t m code" x="44" y="302">{% post_link pc-repair-first-lesson 第一课 %}</text>
  <text class="t ok" x="352" y="297" text-anchor="middle">✓</text>
  <text class="t ok" x="462" y="297" text-anchor="middle">✓</text>
  <text class="t ok" x="572" y="297" text-anchor="middle">✓</text>

  <text class="t ft" x="30" y="350">② 说的是"跟着 root 走"，③ 说的是"跟着 slug 走"。slug 不变，链接就永远对。</text>
</svg>
