<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-label="症状分诊图：开不了机、能开机但系统异常、硬件层面三类症状分别对应哪几篇文章">
  <style>
    .bg { fill: #f7f1e3; }
    .t { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1c1a17; }
    .th { font-size: 19px; font-weight: 700; }
    .ts { font-size: 12.5px; fill: #4c463e; }
    .nm { font-size: 11px; font-weight: 700; }
    .ds { font-size: 10px; fill: #4c463e; }
    .hd { font-size: 11.5px; font-weight: 700; fill: #fffdf6; }
    .ft { font-size: 11.5px; fill: #6b6459; }
    .card { fill: #fffdf6; stroke: #e0d6c0; stroke-width: 1.5; }
    .z1 { fill: #cc3b3b; }
    .z2 { fill: #2f5d8a; }
    .z3 { fill: #4f7f47; }
    .d1 { fill: #b02f2f; }
    .d2 { fill: #2f5d8a; }
    .d3 { fill: #4f7f47; }
  </style>

  <rect class="bg" width="680" height="420"/>

  <text class="t th" x="30" y="38">先分诊：你的电脑属于哪一类</text>
  <text class="t ts" x="30" y="60">同一个症状背后可能是三种完全不同的原因，别在错误的分支上花时间</text>

  <!-- 第一列：开不了机 -->
  <rect class="card" x="30" y="84" width="194" height="296" rx="10"/>
  <rect class="z1" x="30" y="84" width="194" height="34" rx="10"/>
  <rect class="z1" x="30" y="104" width="194" height="14"/>
  <text class="t hd" x="44" y="106">A 开不了机 / 画面不对</text>
  <text class="t nm d1" x="44" y="146">按电源键毫无反应</text>
  <text class="t ds" x="44" y="163">灯不亮、风扇不转</text>
  <text class="t nm d1" x="44" y="198">黑屏，卡在厂商 logo</text>
  <text class="t ds" x="44" y="215">先分清进不进得了 BIOS</text>
  <text class="t nm d1" x="44" y="250">用着用着突然重启</text>
  <text class="t ds" x="44" y="267">先排除电源与过热</text>
  <text class="t ds" x="44" y="316">读：#1 第一课 · #3 黑屏</text>
  <text class="t ds" x="44" y="334">#2 不定时重启</text>
  <text class="t ds" x="44" y="360">这一列先别拆机。</text>

  <!-- 第二列：能开机但系统异常 -->
  <rect class="card" x="243" y="84" width="194" height="296" rx="10"/>
  <rect class="z2" x="243" y="84" width="194" height="34" rx="10"/>
  <rect class="z2" x="243" y="104" width="194" height="14"/>
  <text class="t hd" x="257" y="106">B 能开机，但不对劲</text>
  <text class="t nm d2" x="257" y="146">蓝屏、自己重启</text>
  <text class="t ds" x="257" y="163">读转储文件，定位到驱动</text>
  <text class="t nm d2" x="257" y="192">越用越慢，开机很久</text>
  <text class="t ds" x="257" y="209">先做七步体检，别急重装</text>
  <text class="t nm d2" x="257" y="238">弹窗广告、主页被改</text>
  <text class="t ds" x="257" y="255">安全模式清场后揪根</text>
  <text class="t nm d2" x="257" y="284">更新完就蓝屏 / 黑屏</text>
  <text class="t ds" x="257" y="301">优先回滚，别先重装</text>
  <text class="t nm d2" x="257" y="330">设备一堆黄叹号</text>
  <text class="t ds" x="257" y="347">按硬件 ID 认准型号</text>
  <text class="t ds" x="257" y="370">读：#4 #5 #8 #10 #11</text>

  <!-- 第三列：硬件层面 -->
  <rect class="card" x="456" y="84" width="194" height="296" rx="10"/>
  <rect class="z3" x="456" y="84" width="194" height="34" rx="10"/>
  <rect class="z3" x="456" y="104" width="194" height="14"/>
  <text class="t hd" x="470" y="106">C 用得了，但心里没底</text>
  <text class="t nm d3" x="470" y="146">硬盘咔咔响 / SMART 黄</text>
  <text class="t ds" x="470" y="163">先备份，再判断还能用多久</text>
  <text class="t nm d3" x="470" y="192">风扇狂转、机身烫手</text>
  <text class="t ds" x="470" y="209">清灰换硅脂的完整流程</text>
  <text class="t nm d3" x="470" y="238">想升级，不知值不值</text>
  <text class="t ds" x="470" y="255">先换哪个、加多少、何时停</text>
  <text class="t ds" x="470" y="316">读：#6 硬盘 · #7 散热</text>
  <text class="t ds" x="470" y="334">#12 升级取舍</text>
  <text class="t ds" x="470" y="360">这一列多为预防。</text>

  <text class="t ft" x="30" y="404">表里没有的症状：先翻 #1《电脑维修第一课》，它给的是排查顺序，不是具体修法。</text>
</svg>
